apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: test-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-test
  namespace: test-app
  labels:
    app: storage-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-test
  template:
    metadata:
      labels:
        app: storage-test
    spec:
      containers:
        - name: busybox
          image: busybox:latest
          command:
            [
              "sh",
              "-c",
              'echo "Storage test at $(date)" > /data/test.txt && sleep 3600',
            ]
          volumeMounts:
            - name: test-volume
              mountPath: /data
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"
              cpu: "200m"
      volumes:
        - name: test-volume
          persistentVolumeClaim:
            claimName: test-pvc
