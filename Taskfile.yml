version: "3"

vars:
  EXAMPLES_DIR: examples
  MODULE_DIR: .

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  format:
    desc: Format all Terraform files
    cmds:
      - terraform fmt -recursive {{.MODULE_DIR}}

  validate:
    desc: Validate the main module
    dir: "{{.MODULE_DIR}}"
    cmds:
      - terraform init -upgrade
      - terraform validate

  validate-examples:
    desc: Validate all examples
    cmds:
      - task: validate-fargate
      - task: validate-flux-cd
      - task: validate-on-demand
      - task: validate-spot

  validate-fargate:
    desc: Validate fargate example
    dir: "{{.EXAMPLES_DIR}}/fargate"
    cmds:
      - echo "🔍 Validating fargate example..."
      - terraform init -upgrade
      - terraform validate
      - echo "✅ fargate validation complete"

  validate-flux-cd:
    desc: Validate flux-cd example
    dir: "{{.EXAMPLES_DIR}}/flux-cd"
    cmds:
      - echo "🔍 Validating flux-cd example..."
      - terraform init -upgrade
      - terraform validate
      - echo "✅ flux-cd validation complete"

  validate-on-demand:
    desc: Validate on-demand example
    dir: "{{.EXAMPLES_DIR}}/on-demand"
    cmds:
      - echo "🔍 Validating on-demand example..."
      - terraform init -upgrade
      - terraform validate
      - echo "✅ on-demand validation complete"

  validate-spot:
    desc: Validate spot example
    dir: "{{.EXAMPLES_DIR}}/spot"
    cmds:
      - echo "🔍 Validating spot example..."
      - terraform init -upgrade
      - terraform validate
      - echo "✅ spot validation complete"

  plan:
    desc: Plan the main module (requires vars)
    dir: "{{.MODULE_DIR}}"
    cmds:
      - terraform plan {{.CLI_ARGS}}

  plan-examples:
    desc: Plan all examples (dry-run to check syntax)
    cmds:
      - task: plan-fargate
      - task: plan-flux-cd
      - task: plan-on-demand
      - task: plan-spot

  plan-fargate:
    desc: Plan fargate example
    dir: "{{.EXAMPLES_DIR}}/fargate"
    cmds:
      - echo "📋 Planning fargate example..."
      - terraform plan -var-file="terraform.tfvars" -out=tfplan || echo "⚠️  Plan failed - check variables and AWS credentials"

  plan-flux-cd:
    desc: Plan flux-cd example
    dir: "{{.EXAMPLES_DIR}}/flux-cd"
    cmds:
      - echo "📋 Planning flux-cd example..."
      - terraform plan -var-file="terraform.tfvars" -out=tfplan || echo "⚠️  Plan failed - check variables and AWS credentials"

  plan-on-demand:
    desc: Plan on-demand example
    dir: "{{.EXAMPLES_DIR}}/on-demand"
    cmds:
      - echo "📋 Planning on-demand example..."
      - terraform plan -var-file="terraform.tfvars" -out=tfplan || echo "⚠️  Plan failed - check variables and AWS credentials"

  plan-spot:
    desc: Plan spot example
    dir: "{{.EXAMPLES_DIR}}/spot"
    cmds:
      - echo "📋 Planning spot example..."
      - terraform plan -var-file="terraform.tfvars" -out=tfplan || echo "⚠️  Plan failed - check variables and AWS credentials"

  apply-fargate:
    desc: Apply fargate example
    dir: "{{.EXAMPLES_DIR}}/fargate"
    cmds:
      - echo "🚀 Applying fargate example..."
      - terraform apply -var-file="terraform.tfvars" {{.CLI_ARGS}}

  apply-flux-cd:
    desc: Apply flux-cd example
    dir: "{{.EXAMPLES_DIR}}/flux-cd"
    cmds:
      - echo "🚀 Applying flux-cd example..."
      - terraform apply -var-file="terraform.tfvars" {{.CLI_ARGS}}

  apply-on-demand:
    desc: Apply on-demand example
    dir: "{{.EXAMPLES_DIR}}/on-demand"
    cmds:
      - echo "🚀 Applying on-demand example..."
      - terraform apply -var-file="terraform.tfvars" {{.CLI_ARGS}}

  apply-spot:
    desc: Apply spot example
    dir: "{{.EXAMPLES_DIR}}/spot"
    cmds:
      - echo "🚀 Applying spot example..."
      - terraform apply -var-file="terraform.tfvars" {{.CLI_ARGS}}

  destroy-fargate:
    desc: Destroy fargate example
    dir: "{{.EXAMPLES_DIR}}/fargate"
    cmds:
      - echo "💥 Destroying fargate example..."
      - terraform destroy -var-file="terraform.tfvars" {{.CLI_ARGS}}

  destroy-flux-cd:
    desc: Destroy flux-cd example
    dir: "{{.EXAMPLES_DIR}}/flux-cd"
    cmds:
      - echo "💥 Destroying flux-cd example..."
      - terraform destroy -var-file="terraform.tfvars" {{.CLI_ARGS}}

  destroy-on-demand:
    desc: Destroy on-demand example
    dir: "{{.EXAMPLES_DIR}}/on-demand"
    cmds:
      - echo "💥 Destroying on-demand example..."
      - terraform destroy -var-file="terraform.tfvars" {{.CLI_ARGS}}

  destroy-spot:
    desc: Destroy spot example
    dir: "{{.EXAMPLES_DIR}}/spot"
    cmds:
      - echo "💥 Destroying spot example..."
      - terraform destroy -var-file="terraform.tfvars" {{.CLI_ARGS}}

  clean:
    desc: Clean all Terraform state and cache files
    cmds:
      - echo "🧹 Cleaning main module..."
      - rm -rf {{.MODULE_DIR}}/.terraform
      - rm -f {{.MODULE_DIR}}/terraform.tfstate*
      - rm -f {{.MODULE_DIR}}/tfplan
      - echo "🧹 Cleaning examples..."
      - find {{.EXAMPLES_DIR}} -name ".terraform" -type d -exec rm -rf {} + 2>/dev/null || true
      - find {{.EXAMPLES_DIR}} -name "terraform.tfstate*" -type f -delete 2>/dev/null || true
      - find {{.EXAMPLES_DIR}} -name "tfplan" -type f -delete 2>/dev/null || true
      - echo "✅ Cleanup complete"

  init-all:
    desc: Initialize main module and all examples
    cmds:
      - echo "🔧 Initializing main module..."
      - terraform -chdir={{.MODULE_DIR}} init -upgrade
      - echo "🔧 Initializing examples..."
      - terraform -chdir={{.EXAMPLES_DIR}}/fargate init -upgrade
      - terraform -chdir={{.EXAMPLES_DIR}}/flux-cd init -upgrade
      - terraform -chdir={{.EXAMPLES_DIR}}/on-demand init -upgrade
      - terraform -chdir={{.EXAMPLES_DIR}}/spot init -upgrade
      - echo "✅ All modules initialized"

  test-all:
    desc: Run complete test suite (format, validate, plan)
    cmds:
      - echo "🧪 Running complete test suite..."
      - task: format
      - task: validate
      - task: validate-examples
      - echo "✅ All tests passed!"

  docs-preview:
    desc: Preview documentation with terraform-docs
    cmds:
      - terraform-docs markdown table --output-file README-generated.md {{.MODULE_DIR}}
      - echo "📖 Documentation preview generated in README-generated.md"

  format-check:
    desc: Check if all Terraform files are properly formatted
    cmds:
      - terraform fmt -check -recursive {{.MODULE_DIR}}

  validate-module:
    desc: Validate only the centralized module
    dir: "modules/eks"
    cmds:
      - echo "🔍 Validating centralized EKS module..."
      - terraform init -upgrade
      - terraform validate
      - echo "✅ Module validation complete"

  clean-examples:
    desc: Clean only example directories
    cmds:
      - echo "🧹 Cleaning examples..."
      - find {{.EXAMPLES_DIR}} -name ".terraform" -type d -exec rm -rf {} + 2>/dev/null || true
      - find {{.EXAMPLES_DIR}} -name "terraform.tfstate*" -type f -delete 2>/dev/null || true
      - find {{.EXAMPLES_DIR}} -name "tfplan" -type f -delete 2>/dev/null || true
      - echo "✅ Examples cleanup complete"

  init-examples:
    desc: Initialize only example directories
    cmds:
      - echo "🔧 Initializing examples..."
      - terraform -chdir={{.EXAMPLES_DIR}}/fargate init -upgrade
      - terraform -chdir={{.EXAMPLES_DIR}}/flux-cd init -upgrade
      - terraform -chdir={{.EXAMPLES_DIR}}/on-demand init -upgrade
      - terraform -chdir={{.EXAMPLES_DIR}}/spot init -upgrade
      - echo "✅ All examples initialized"

  security-scan:
    desc: Run security scan with tfsec (if available)
    cmds:
      - |
        if command -v tfsec >/dev/null 2>&1; then
          echo "🔒 Running security scan..."
          tfsec {{.MODULE_DIR}}
        else
          echo "⚠️  tfsec not found. Install with: brew install tfsec"
        fi

  cost-estimate:
    desc: Estimate costs with infracost (if available)
    dir: "{{.EXAMPLES_DIR}}/on-demand"
    cmds:
      - |
        if command -v infracost >/dev/null 2>&1; then
          echo "💰 Estimating costs for on-demand example..."
          infracost breakdown --path .
        else
          echo "⚠️  infracost not found. Install from: https://www.infracost.io/docs/#quick-start"
        fi

  help:
    desc: Show detailed help for common workflows
    cmds:
      - echo "🚀 AWS EKS Module Task Runner"
      - echo ""
      - echo "Common workflows:"
      - echo "  task test-all - Complete test suite"
      - echo "  task validate-examples - Validate all examples"
      - echo "  task plan-examples - Plan all examples"
      - echo ""
      - echo "Individual example commands:"
      - echo "  task apply-fargate - Deploy fargate cluster"
      - echo "  task apply-flux-cd - Deploy flux-cd cluster"
      - echo "  task apply-on-demand - Deploy on-demand cluster"
      - echo "  task apply-spot - Deploy spot cluster"
      - echo "  task destroy-fargate - Destroy fargate cluster"
      - echo "  task destroy-flux-cd - Destroy flux-cd cluster"
      - echo "  task destroy-on-demand - Destroy on-demand cluster"
      - echo "  task destroy-spot - Destroy spot cluster"
      - echo ""
      - echo "Maintenance:"
      - echo "  task clean - Clean all state files"
      - echo "  task init-all - Initialize all modules"
      - echo "  task format - Format all Terraform files"
      - echo ""
      - echo "Advanced:"
      - echo "  task security-scan - Security analysis"
      - echo "  task cost-estimate - Cost estimation"
      - echo "  task docs-preview - Generate documentation"
