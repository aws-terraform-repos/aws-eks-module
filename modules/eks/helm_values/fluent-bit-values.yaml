serviceAccount:
  create: true
  name: fluent-bit
  annotations:
    eks.amazonaws.com/role-arn: "${fluent_bit_role_arn}"

parsers:
  enabled: true
  regex:
    - name: nginx
      regex: '^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$'
      timeKey: time
      timeFormat: "%d/%b/%Y:%H:%M:%S %z"

config:
  service: |
    [SERVICE]
        Parsers_File parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        Parser docker
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        DB /var/log/flb_kube.db
        DB.Sync Normal

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name parser
        Match kube.*
        Key_Name log
        Parser nginx
        Reserve_Data true

  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.*
        region ${aws_region}
        log_group_name /aws/eks/${cluster_name}/applications
        log_stream_prefix fluentbit-
        auto_create_group On
